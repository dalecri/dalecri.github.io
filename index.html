<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CD Archive</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0639C6;
      touch-action: none; /* Prevents default browser swiping/pull-to-refresh */
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar { height: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(226, 224, 211, 0.1); border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #E2E0D3; border-radius: 4px; }
    
    @keyframes static-noise {
      0%, 100% { background-position: 0 0; }
      10% { background-position: -5% -10%; }
      20% { background-position: -15% 5%; }
      30% { background-position: 7% -25%; }
      40% { background-position: 20% 25%; }
      50% { background-position: -25% 10%; }
      60% { background-position: 15% 5%; }
      70% { background-position: 0% 15%; }
      80% { background-position: 25% 35%; }
      90% { background-position: -10% 10%; }
    }
    
    .screen-static {
      background-image: repeating-radial-gradient(
        circle at 17% 32%, #111111, #111111 2px, #042687 3px, #042687 4px
      );
      background-size: 200% 200%;
      animation: static-noise 0.2s steps(2) infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .animate-blink { animation: blink 1s step-end infinite; }
    
    @keyframes matrix-glow {
      0%, 100% { text-shadow: 0 0 2px #34d399, 0 0 4px #34d399; opacity: 1; }
      50% { text-shadow: 0 0 1px #34d399, 0 0 2px #34d399; opacity: 0.8; }
    }
    .matrix-text {
      color: #34d399;
      font-family: 'Space Mono', monospace;
      animation: matrix-glow 2s infinite;
    }

    /* --- CD spin + shine interaction --- */
    @keyframes cd-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .cd-spin-target {
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .cd-shine {
      background: linear-gradient(115deg, transparent 22%, rgba(255,255,255,0.95) 46%, rgba(255,255,255,0.95) 54%, transparent 78%);
      mix-blend-mode: overlay;
      opacity: 0;
      transition: opacity 0.35s ease;
      will-change: opacity;
    }
    /* Slow, subtle spin + mirror shine while hovered (desktop) or pressed (mobile) */
    .group:hover .cd-spin-target,
    .group:active .cd-spin-target {
      animation: cd-spin 3.2s linear infinite;
    }
    .group:hover .cd-shine,
    .group:active .cd-shine {
      opacity: 1;
    }
    @media (hover: none) {
      .group:hover .cd-spin-target { animation: none; }
      .group:active .cd-spin-target { animation: cd-spin 3.2s linear infinite; }
      .group:hover .cd-shine { opacity: 0; }
      .group:active .cd-shine { opacity: 1; }
    }
  </style>
</head>

                  key={`${x}-${y}`}
                  style={{
                    position: 'absolute', left: `${(x / W) * 100}%`, top: `${(y / H) * 100}%`,
                    width: `calc(${100 / W}% + 1px)`, height: `calc(${100 / H}% + 1px)`,
                    backgroundColor: fill,
                  }}
                />
              );
            })
          )}
        </div>
      );
    };

    const PixelCD = ({ className = "", hueShift = 0 }) => (
      <div className={`relative aspect-square overflow-hidden ${className}`} style={{ borderRadius: '50%', filter: `hue-rotate(${hueShift}deg)` }}>
        <div className="cd-spin-target absolute inset-0">
          <PixelArt grid={CD_GRID} className="w-full h-full" />
        </div>
        <div className="cd-shine absolute inset-0 pointer-events-none" style={{ borderRadius: '50%' }} />
      </div>
    );

    const PixelMonitor = ({ className = "" }) => (
      <PixelArt grid={MONITOR_GRID} className={className} />
    );

    // --- Main Application Component ---
    function App() {
      const [viewMode, setViewMode] = useState('browse');
      const [activeIndex, setActiveIndex] = useState(0); 
      const [computerState, setComputerState] = useState('idle'); 
      const [activeProject, setActiveProject] = useState(null);
      const [flyingCD, setFlyingCD] = useState(null);
      const [radius, setRadius] = useState(450);
      
      const slotRef = useRef(null);
      const containerRef = useRef(null);
      const touchStartX = useRef(null);
      const isSwiping = useRef(false);
      
      const N = PROJECTS.length;
      const theta = 360 / N;

      // Handle Resize for Responsive Carousel Radius
      useEffect(() => {
        const updateRadius = () => {
          setRadius(window.innerWidth < 768 ? 160 : 450);
        };
        updateRadius();
        window.addEventListener('resize', updateRadius);
        return () => window.removeEventListener('resize', updateRadius);
      }, []);

      // Keyboard & Scroll Navigation
      useEffect(() => {
        if (viewMode !== 'browse') return;

        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft') setActiveIndex(prev => prev - 1);
          if (e.key === 'ArrowRight') setActiveIndex(prev => prev + 1);
          if (e.key === 'Enter') {
            const pIndex = ((activeIndex % N) + N) % N;
            handleCDSelect(pIndex);
          }
        };

        let lastScroll = 0;
        const handleWheel = (e) => {
          const now = Date.now();
          if (now - lastScroll < 150) return;
          if (Math.abs(e.deltaY) > 10 || Math.abs(e.deltaX) > 10) {
            if (e.deltaY > 0 || e.deltaX > 0) setActiveIndex(prev => prev + 1);
            else setActiveIndex(prev => prev - 1);
            lastScroll = now;
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('wheel', handleWheel, { passive: false });
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('wheel', handleWheel);
        };
      }, [viewMode, activeIndex, N]);

      // Mobile Touch Handlers
      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        isSwiping.current = false;
      };

      const handleTouchMove = (e) => {
        if (touchStartX.current === null) return;
        const touchCurrentX = e.touches[0].clientX;
        if (Math.abs(touchCurrentX - touchStartX.current) > 10) {
          isSwiping.current = true;
        }
      };

      const handleTouchEnd = (e) => {
        if (touchStartX.current === null) return;
        const touchEndX = e.changedTouches[0].clientX;
        const delta = touchEndX - touchStartX.current;

        if (Math.abs(delta) > 40) { 
          if (delta > 0) setActiveIndex(prev => prev - 1); 
          else setActiveIndex(prev => prev + 1); 
          
          setTimeout(() => { isSwiping.current = false; }, 100);
        } else {
          isSwiping.current = false;
        }
        touchStartX.current = null;
      };

      const handleCDSelect = (clickedProjectIndex, e) => {
        if (isSwiping.current) return;

        const currentProjectIndex = ((activeIndex % N) + N) % N;

        if (clickedProjectIndex !== currentProjectIndex && viewMode === 'browse') {
          let diff = clickedProjectIndex - currentProjectIndex;
          if (diff > N / 2) diff -= N;
          if (diff < -N / 2) diff += N;
          
          setActiveIndex(prev => prev + diff);
          return;
        }

        if (computerState === 'inserting' || computerState === 'reading') return;

        const project = PROJECTS[clickedProjectIndex];
        const hue = hueForProject(project.id);
        
        let startX = window.innerWidth / 2 - 100;
        let startY = window.innerHeight / 2 - 100;
        let cdWidth = window.innerWidth < 768 ? 140 : 200;

        if (e && e.currentTarget) {
          const cdRect = e.currentTarget.getBoundingClientRect();
          const containerRect = containerRef.current.getBoundingClientRect();
          startX = cdRect.left - containerRect.left;
          startY = cdRect.top - containerRect.top;
          cdWidth = cdRect.width;
        }

        setViewMode('playing');
        setComputerState('inserting');
        setActiveProject(null);

        setTimeout(() => {
          const slotRect = slotRef.current.getBoundingClientRect();
          const containerRect = containerRef.current.getBoundingClientRect();
          
          const endX = slotRect.left - containerRect.left + (slotRect.width / 2) - (cdWidth / 2) * 0.3;
          const endY = slotRect.top - containerRect.top + (slotRect.height / 2) - (cdWidth / 2) * 0.3;

          setFlyingCD({ project, hue, startX, startY, endX, endY, width: cdWidth, isMoving: false });

          setTimeout(() => {
            setFlyingCD(prev => ({ ...prev, isMoving: true }));
          }, 50);

          setTimeout(() => {
            setFlyingCD(null);
            setComputerState('reading');
          }, 1250);

          setTimeout(() => {
            setActiveProject(project);
            setComputerState('playing');
          }, 2750); 
        }, 300);
      };

      const handleEject = () => {
        setComputerState('idle');
        setActiveProject(null);
        setViewMode('browse');
      };

      return (
        <div 
          ref={containerRef}
          className="min-h-screen w-full relative overflow-hidden flex flex-col font-['Space_Grotesk'] text-[#E2E0D3]"
        >
          {/* Header */}
          <header className="absolute top-4 left-4 md:top-10 md:left-10 z-10 pointer-events-none">
            <h1 
              className="font-['Silkscreen'] text-2xl md:text-5xl lowercase tracking-wider leading-none"
              style={{ textShadow: `4px 4px 0 ${THEME.darkBlue}` }}
            >
              cd / archive
            </h1>
            <p className="mt-1 md:mt-2 font-bold tracking-widest opacity-80 text-[10px] md:text-sm">
              CRISTOBAL D'ALESSIO
            </p>
          </header>

          {/* ========================================
            STATE 1: BROWSE MODE (CIRCULAR CAROUSEL)
            ========================================
          */}
          <div 
            className={`absolute inset-0 flex items-center justify-center transition-all duration-700 ease-in-out
              ${viewMode === 'browse' ? 'opacity-100 scale-100 pointer-events-auto' : 'opacity-0 scale-90 pointer-events-none translate-y-20'}
            `}
            style={{ perspective: '1500px' }}
          >
            {viewMode === 'browse' && (
              <div className="text-center absolute top-24 md:top-32 w-full opacity-60 text-[10px] md:text-sm tracking-widest animate-pulse font-bold px-4">
                SWIPE, SCROLL, OR USE ARROW KEYS • TAP CENTER TO LOAD
              </div>
            )}
            
            <div 
              className="relative w-full h-[400px] md:h-[500px] flex items-center justify-center touch-none"
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
            >
              {PROJECTS.map((project, index) => {
                const currentProjectIndex = ((activeIndex % N) + N) % N;
                
                const absOffset = Math.min(Math.abs(currentProjectIndex - index), N - Math.abs(currentProjectIndex - index));
                const isFront = absOffset === 0;

                const continuousOffset = index - activeIndex;
                const angleDeg = continuousOffset * theta;
                const rad = angleDeg * (Math.PI / 180);
                
                const x = Math.sin(rad) * radius;
                const baseZ = Math.cos(rad) * radius - radius; 
                
                const bumpScale = window.innerWidth < 768 ? 80 : 120;
                const bump = Math.pow(Math.max(0, Math.cos(rad)), 10) * bumpScale;
                const z = baseZ + bump;
                
                const zLayer = Math.round((Math.cos(rad) + 1) * 100);
                const accent = (CATEGORY_COLORS[project.category] || CATEGORY_COLORS.default)[0];
                const hue = hueForProject(project.id);

                return (
                  <div 
                    key={project.id}
                    onClick={(e) => handleCDSelect(index, e)}
                    className="absolute cursor-pointer flex flex-col items-center justify-center group"
                    style={{
                      transform: `translateX(${x}px) translateZ(${z}px) rotateY(${angleDeg}deg)`,
                      opacity: absOffset > 2 ? 0 : 1 - (absOffset * 0.4), 
                      pointerEvents: absOffset > 1 ? 'none' : 'auto',
                      zIndex: zLayer,
                      transition: 'transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.7s'
                    }}
                  >
                    <div className="flex items-center justify-center relative">
                      <div
                        className={`transition-all duration-700 ease-out drop-shadow-2xl
                          ${isFront ? 'scale-110' : 'scale-100 opacity-60'}
                        `}
                      >
                        <PixelCD hueShift={hue} className="w-[140px] h-[140px] md:w-[260px] md:h-[260px]" />
                      </div>
                    </div>
                    
                    <div 
                      className={`absolute top-full mt-6 md:mt-10 w-48 md:w-64 text-center transition-all duration-300
                        ${isFront ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}
                      `}
                    >
                      <h2 className="font-['Silkscreen'] text-lg md:text-2xl mb-1 text-white truncate px-2">{project.title}</h2>
                      <p className="text-[10px] md:text-sm opacity-80 uppercase tracking-widest" style={{ color: accent }}>{project.category}</p>
                      <p className="text-[9px] md:text-xs opacity-60 mt-1 md:mt-2 px-2 leading-relaxed mx-auto">{project.description}</p>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* ========================================
            STATE 2: PLAYING MODE (PIXEL MONITOR)
            ========================================
          */}
          <div 
            className={`absolute inset-0 flex items-center justify-center pb-10 md:pb-20 px-4 transition-all duration-700 ease-in-out
              ${viewMode === 'playing' ? 'opacity-100 translate-y-0 pointer-events-auto scale-100' : 'opacity-0 translate-y-full pointer-events-none scale-90'}
            `}
          >
            {/* Floating Action Buttons */}
            <div 
              className={`absolute z-50 flex gap-2 md:gap-4 transition-all duration-500 ease-in-out delay-500
                top-4 right-4 md:top-10 md:right-10 flex-col md:flex-row items-end
                ${viewMode === 'playing' && computerState === 'playing' ? 'opacity-100 translate-y-0' : 'opacity-0 md:-translate-y-4 pointer-events-none'}
              `}
            >
              <button 
                onClick={handleEject}
                className="px-4 py-2 bg-white text-black font-['Silkscreen'] text-xs md:text-sm hover:bg-red-400 transition-colors shadow-[4px_4px_0_0_#042687]"
              >
                &lt; BACK
              </button>
              {activeProject && (
                <button 
                  onClick={() => window.open(activeProject.url, '_blank')}
                  className="px-4 py-2 bg-[#a3e635] text-black font-['Silkscreen'] text-xs md:text-sm hover:bg-emerald-400 transition-colors shadow-[4px_4px_0_0_#042687]"
                >
                  RUN PROJECT
                </button>
              )}
            </div>

            <div className="w-full max-w-md relative mx-auto" style={{ aspectRatio: '42 / 39' }}>
              
              <PixelMonitor className="absolute inset-0 w-full h-full drop-shadow-2xl" />

              {/* Power light (overlays the baked-in light on the case) */}
              <div 
                className={`absolute ${computerState === 'inserting' || computerState === 'reading' ? 'animate-blink' : ''}`}
                style={{ 
                  left: '61.9%', top: '74.36%', width: '4.76%', height: '5.13%',
                  backgroundColor: computerState === 'idle' ? THEME.black : (computerState === 'playing' ? '#10b981' : '#eab308'),
                }}
              />

              {/* Screen overlay */}
              <div className="absolute overflow-hidden" style={{ left: '11.905%', top: '15.385%', width: '54.762%', height: '48.718%' }}>
                <div className="w-full h-full relative overflow-hidden bg-black flex flex-col items-center justify-center font-['Silkscreen'] text-xs">
                  
                  {computerState === 'idle' && (
                    <div className="text-emerald-400 text-center flex flex-col items-center">
                      <p className="mb-2 text-[7px] sm:text-[9px]">SYSTEM READY</p>
                      <p className="animate-blink text-[7px] sm:text-[9px]">INSERT DISK...</p>
                    </div>
                  )}

                  {(computerState === 'inserting' || computerState === 'reading') && (
                    <div className="absolute inset-0 bg-black flex flex-col justify-start items-start p-1 overflow-hidden">
                      <div className="matrix-text" style={{ fontSize: '4px', lineHeight: '7px' }}>&gt; SYS_INIT... OK</div>
                      <div className="matrix-text" style={{ fontSize: '4px', lineHeight: '7px' }}>&gt; MOUNT //CD-ROM</div>
                      <div className="matrix-text" style={{ fontSize: '4px', lineHeight: '7px' }}>&gt; DECRYPTING...</div>
                      <div className="matrix-text animate-pulse" style={{ fontSize: '4px', lineHeight: '7px', marginTop: '2px' }}>&gt; READING SECTORS...</div>
                    </div>
                  )}

                  {computerState === 'playing' && activeProject && (
                    <div className="absolute inset-0 bg-white relative">
                      <img 
                        src={`https://api.microlink.io?url=${encodeURIComponent(activeProject.url)}&screenshot=true&embed=screenshot.url`}
                        alt={activeProject.title}
                        className="w-full h-full object-cover"
                        loading="lazy"
                      />
                      <div className="absolute inset-0 pointer-events-none opacity-20" 
                           style={{ backgroundImage: 'linear-gradient(transparent 50%, rgba(0,0,0,0.5) 50%)', backgroundSize: '100% 4px' }} />
                    </div>
                  )}

                  <div className="absolute inset-0 pointer-events-none bg-gradient-to-tr from-transparent via-white/10 to-transparent" />
                </div>
              </div>

              <div ref={slotRef} className="absolute" style={{ left: '88.095%', top: '38.46%', width: '9.524%', height: '20.51%' }} />
            </div>
          </div>

          {/* ========================================
            FLOATING ANIMATED CD (true 3D flip toward the monitor)
            ========================================
          */}
          <div className="absolute inset-0 pointer-events-none z-50" style={{ perspective: '1200px' }}>
            {flyingCD && (
              <div
                style={{
                  position: 'absolute',
                  width: flyingCD.width,
                  height: flyingCD.width,
                  left: flyingCD.startX,
                  top: flyingCD.startY,
                  transformStyle: 'preserve-3d',
                  transform: flyingCD.isMoving 
                    ? `translate3d(${flyingCD.endX - flyingCD.startX}px, ${flyingCD.endY - flyingCD.startY}px, -160px) rotateY(1080deg) rotateX(12deg) scale(0.35)` 
                    : 'translate3d(0,0,0) rotateY(0deg) rotateX(0deg) scale(1)',
                  transitionProperty: 'transform',
                  transitionDuration: '1150ms',
                  transitionTimingFunction: 'cubic-bezier(0.4, 0, 0.2, 1)',
                }}
              >
                <PixelCD hueShift={flyingCD.hue} className="w-full h-full drop-shadow-2xl" />
              </div>
            )}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
