<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CD Archive</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0639C6;
    }
    .custom-scroll::-webkit-scrollbar { height: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(226, 224, 211, 0.1); border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #E2E0D3; border-radius: 4px; }
    
    @keyframes static-noise {
      0%, 100% { background-position: 0 0; }
      10% { background-position: -5% -10%; }
      20% { background-position: -15% 5%; }
      30% { background-position: 7% -25%; }
      40% { background-position: 20% 25%; }
      50% { background-position: -25% 10%; }
      60% { background-position: 15% 5%; }
      70% { background-position: 0% 15%; }
      80% { background-position: 25% 35%; }
      90% { background-position: -10% 10%; }
    }
    
    .screen-static {
      background-image: repeating-radial-gradient(
        circle at 17% 32%, #111111, #111111 2px, #042687 3px, #042687 4px
      );
      background-size: 200% 200%;
      animation: static-noise 0.2s steps(2) infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .animate-blink { animation: blink 1s step-end infinite; }
    
    @keyframes matrix-glow {
      0%, 100% { text-shadow: 0 0 2px #34d399, 0 0 4px #34d399; opacity: 1; }
      50% { text-shadow: 0 0 1px #34d399, 0 0 2px #34d399; opacity: 0.8; }
    }
    .matrix-text {
      color: #34d399;
      font-family: 'Space Mono', monospace;
      animation: matrix-glow 2s infinite;
    }

    /* 3D Carousel Utilities */
    .carousel-item { transition: opacity 0.5s, transform 0.5s, z-index 0s; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Configuration & Data ---
    const THEME = {
      blue: '#0639C6',
      beige: '#E2E0D3',
      darkBlue: '#042687',
      black: '#111111',
    };

    const PROJECTS = [
      { id: 1, title: "Lamplight", description: "Your cozy RSVP Library", category: "productivity", url: "https://dalecri.github.io/Lamplight/" },
      { id: 2, title: "SkyflatDo", description: "Apartment inspired todo", category: "productivity", url: "https://dalecri.github.io/floating-apartment-todo/" },
      { id: 3, title: "GardenDo", description: "Garden Voxel-inspired Todo App", category: "interactive", url: "https://dalecri.github.io/japanese-voxel-todo/" },
      { id: 4, title: "StardDo", description: "Labelle-inspired Voxel Todo App", category: "interactive", url: "https://dalecri.github.io/voxel-city-river/" },
      { id: 5, title: "Typerrium", description: "Grow digital flora through speed and precision", category: "interactive", url: "https://dalecri.github.io/typing-speed-terrarium/" },
      { id: 6, title: "Maple QR", description: "Geometric floral QR generator", category: "productivity", url: "https://dalecri.github.io/QR-Code-generator/" },
      { id: 7, title: "Typerule", description: "Watch your castle grow with your writing", category: "interactive", url: "https://dalecri.github.io/cathedral-markdown/" },
      { id: 8, title: "Wordnest", description: "Practice your french", category: "productivity", url: "https://dalecri.github.io/Wordnest/" },
      { id: 9, title: "Prettycode", description: "Export beautiful code snippets", category: "productivity", url: "https://dalecri.github.io/nimbus-code-beautifier/" },
      { id: 10, title: "CubeWall", description: "Prismatic cube-grid wallpaper studio", category: "art", url: "https://dalecri.github.io/isometric-cube-wallpaper-generator/" },
      { id: 12, title: "Polygrade", description: "Minimalist canvas for low-fidelity art", category: "art", url: "https://dalecri.github.io/polygon-wallpaper-generator/" },
      { id: 14, title: "Cryptogotchi", description: "Nurture your digital security companion", category: "productivity", url: "https://dalecri.github.io/tamagotchi-password-gen/" },
      { id: 15, title: "Cozy 2048", description: "Soft-palette numerical merging", category: "game", url: "https://dalecri.github.io/cozy-2048/" },
      { id: 17, title: "Retro Rubic", description: "A tactile 3D geometric puzzle classic", category: "game", url: "https://dalecri.github.io/rubics-cube/" },
      { id: 18, title: "TyQuest", description: "Life is but a game!", category: "productivity", url: "https://dalecri.github.io/tyquest/" },
      { id: 19, title: "Loop Forge", description: "Grid to Strudel Code", category: "interactive", url: "https://dalecri.github.io/Loop-Forge/" }
    ];

    const CATEGORY_COLORS = {
      productivity: ['#38bdf8', '#0284c7'],
      interactive: ['#a3e635', '#4d7c0f'],
      art: ['#f472b6', '#be185d'],
      game: ['#facc15', '#a16207'],
      default: ['#9ca3af', '#4b5563']
    };

    // --- Pixel Art CD Generator ---
    const CD_PIXELS = [
      "        XXXXXXXX        ",
      "      XX11112222XX      ",
      "    XX111111222222XX    ",
      "   X1111111122222222X   ",
      "  X111111111222222222X  ",
      " X11111111112222222222X ",
      " X33111111112222222233X ",
      "X3333111111122222223333X",
      "X333331111XX44XX2233333X",
      "X33333311X455554X223333X",
      "X3333333X455OO554X33333X",
      "X3333333X45OOOO54X33333X",
      "X2233333X45OOOO54X33331X",
      "X2222333X455OO554X33111X",
      "X22222222X455554X111111X",
      "X222222222XX44XX1111111X",
      "X2222222222221111111111X",
      " X22222222222111111111X ",
      " X22222222222111111111X ",
      "  X222222222211111111X  ",
      "   X2222222221111111X   ",
      "    XX222222211111XX    ",
      "      XX22221111XX      ",
      "        XXXXXXXX        "
    ];

    const PixelCD = ({ category, className = "", style = {} }) => {
      const colors = CATEGORY_COLORS[category] || CATEGORY_COLORS.default;
      const pixelSize = 100 / 24; 

      return (
        <div className={`relative aspect-square ${className}`} style={{ ...style, borderRadius: '50%' }}>
          {CD_PIXELS.map((row, y) => 
            row.split('').map((char, x) => {
              if (char === ' ') return null;
              let fill = 'transparent';
              if (char === 'X') fill = THEME.black;
              if (char === '1') fill = colors[0];
              if (char === '2') fill = colors[1];
              if (char === '3') fill = THEME.beige; // Highlight wedge
              if (char === '4') fill = THEME.black; // Inner outline
              if (char === '5') fill = colors[0];   // Inner ring 
              if (char === 'O') fill = 'transparent'; // Center hole

              return (
                <div 
                  key={`${x}-${y}`}
                  style={{
                    position: 'absolute', left: `${x * pixelSize}%`, top: `${y * pixelSize}%`,
                    /* Added +1px to hide subpixel rendering gaps and create solid immersion */
                    width: `calc(${pixelSize}% + 1px)`, height: `calc(${pixelSize}% + 1px)`, 
                    backgroundColor: fill,
                  }}
                />
              );
            })
          )}
        </div>
      );
    };

    // --- Main Application Component ---
    function App() {
      const [viewMode, setViewMode] = useState('browse');
      const [activeIndex, setActiveIndex] = useState(0); 
      const [computerState, setComputerState] = useState('idle'); // idle, inserting, reading, playing
      const [activeProject, setActiveProject] = useState(null);
      const [flyingCD, setFlyingCD] = useState(null);
      
      const slotRef = useRef(null);
      const containerRef = useRef(null);
      
      const N = PROJECTS.length;
      const theta = 360 / N;
      const radius = 450; 

      // Keyboard & Scroll Navigation for Carousel
      useEffect(() => {
        if (viewMode !== 'browse') return;

        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft') setActiveIndex(prev => prev - 1);
          if (e.key === 'ArrowRight') setActiveIndex(prev => prev + 1);
          if (e.key === 'Enter') {
            const pIndex = ((activeIndex % N) + N) % N;
            handleCDSelect(pIndex);
          }
        };

        let lastScroll = 0;
        const handleWheel = (e) => {
          const now = Date.now();
          if (now - lastScroll < 150) return;
          if (Math.abs(e.deltaY) > 10 || Math.abs(e.deltaX) > 10) {
            if (e.deltaY > 0 || e.deltaX > 0) setActiveIndex(prev => prev + 1);
            else setActiveIndex(prev => prev - 1);
            lastScroll = now;
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('wheel', handleWheel, { passive: false });
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('wheel', handleWheel);
        };
      }, [viewMode, activeIndex, N]);

      const handleCDSelect = (clickedProjectIndex, e) => {
        const currentProjectIndex = ((activeIndex % N) + N) % N;

        // Rotate the carousel to background CD if clicked
        if (clickedProjectIndex !== currentProjectIndex && viewMode === 'browse') {
          let diff = clickedProjectIndex - currentProjectIndex;
          if (diff > N / 2) diff -= N;
          if (diff < -N / 2) diff += N;
          
          setActiveIndex(prev => prev + diff);
          return;
        }

        if (computerState === 'inserting' || computerState === 'reading') return;

        const project = PROJECTS[clickedProjectIndex];
        
        let startX = window.innerWidth / 2 - 100;
        let startY = window.innerHeight / 2 - 100;
        let cdWidth = 200;

        if (e && e.currentTarget) {
          const cdRect = e.currentTarget.getBoundingClientRect();
          const containerRect = containerRef.current.getBoundingClientRect();
          startX = cdRect.left - containerRect.left;
          startY = cdRect.top - containerRect.top;
          cdWidth = cdRect.width;
        }

        setViewMode('playing');
        setComputerState('inserting');
        setActiveProject(null);

        // Timings adjusted to allow for longer spin
        setTimeout(() => {
          const slotRect = slotRef.current.getBoundingClientRect();
          const containerRect = containerRef.current.getBoundingClientRect();
          
          const endX = slotRect.left - containerRect.left + (slotRect.width / 2) - (cdWidth / 2);
          const endY = slotRect.top - containerRect.top - (cdWidth / 2) + 10;

          setFlyingCD({ project, startX, startY, endX, endY, width: cdWidth, isMoving: false });

          setTimeout(() => {
            setFlyingCD(prev => ({ ...prev, isMoving: true }));
          }, 50);

          // Give it 1200ms to spin wildly into the slot
          setTimeout(() => {
            setFlyingCD(null);
            setComputerState('reading');
          }, 1250);

          // Read for a bit, then launch
          setTimeout(() => {
            setActiveProject(project);
            setComputerState('playing');
          }, 2750); 
        }, 300);
      };

      const handleEject = () => {
        setComputerState('idle');
        setActiveProject(null);
        setViewMode('browse');
      };

      return (
        <div 
          ref={containerRef}
          className="min-h-screen w-full relative overflow-hidden flex flex-col font-['Space_Grotesk'] text-[#E2E0D3]"
        >
          {/* Header */}
          <header className="absolute top-6 left-6 z-10 md:top-10 md:left-10 pointer-events-none">
            <h1 
              className="font-['Silkscreen'] text-3xl md:text-5xl lowercase tracking-wider leading-none"
              style={{ textShadow: `4px 4px 0 ${THEME.darkBlue}` }}
            >
              cd / archive
            </h1>
            <p className="mt-2 font-bold tracking-widest opacity-80 text-xs md:text-sm">
              CRISTOBAL D'ALESSIO
            </p>
          </header>

          {/* ========================================
            STATE 1: BROWSE MODE (CIRCULAR CAROUSEL)
            ========================================
          */}
          <div 
            className={`absolute inset-0 flex items-center justify-center transition-all duration-700 ease-in-out
              ${viewMode === 'browse' ? 'opacity-100 scale-100 pointer-events-auto' : 'opacity-0 scale-90 pointer-events-none translate-y-20'}
            `}
            style={{ perspective: '1500px' }}
          >
            {viewMode === 'browse' && (
              <div className="text-center absolute top-24 w-full opacity-60 text-sm tracking-widest animate-pulse font-bold">
                SCROLL OR USE ARROW KEYS • CLICK CENTER TO LOAD
              </div>
            )}
            
            {/* Carousel Wrapper - Flattened to avoid CSS 3D intersection bugs */}
            <div className="relative w-full max-w-5xl h-[400px] flex items-center justify-center">
              {PROJECTS.map((project, index) => {
                const currentProjectIndex = ((activeIndex % N) + N) % N;
                
                const absOffset = Math.min(Math.abs(currentProjectIndex - index), N - Math.abs(currentProjectIndex - index));
                const isFront = absOffset === 0;

                // Continuous mathematical offset for perfect infinite rotation
                const continuousOffset = index - activeIndex;
                const angleDeg = continuousOffset * theta;
                const rad = angleDeg * (Math.PI / 180);
                
                // Base coordinates for a cylinder
                const x = Math.sin(rad) * radius;
                const baseZ = Math.cos(rad) * radius - radius; 
                
                // Add a forward "pop" to the CDs as they reach the front to completely avoid overlap
                const bump = Math.pow(Math.max(0, Math.cos(rad)), 10) * 120;
                const z = baseZ + bump;
                
                // Strict depth sorting ensuring the front-most CD is always highest
                const zLayer = Math.round((Math.cos(rad) + 1) * 100);

                return (
                  <div 
                    key={project.id}
                    onClick={(e) => handleCDSelect(index, e)}
                    className="absolute cursor-pointer flex flex-col items-center justify-center group"
                    style={{
                      transform: `translateX(${x}px) translateZ(${z}px) rotateY(${angleDeg}deg)`,
                      opacity: absOffset > 2 ? 0 : 1 - (absOffset * 0.4), 
                      pointerEvents: absOffset > 1 ? 'none' : 'auto',
                      zIndex: zLayer,
                      transition: 'transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.7s'
                    }}
                  >
                    <div className="flex items-center justify-center relative">
                      <PixelCD 
                        category={project.category} 
                        className={`w-[200px] h-[200px] md:w-[260px] md:h-[260px] transition-all duration-700 ease-out drop-shadow-2xl
                          ${isFront ? 'scale-110' : 'scale-100 opacity-60'}
                        `} 
                      />
                    </div>
                    
                    <div 
                      className={`absolute top-full mt-10 w-64 text-center transition-all duration-300
                        ${isFront ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}
                      `}
                    >
                      <h2 className="font-['Silkscreen'] text-2xl mb-1 text-white">{project.title}</h2>
                      <p className="text-sm opacity-80 uppercase tracking-widest" style={{ color: THEME.beige }}>{project.category}</p>
                      <p className="text-xs opacity-60 mt-2 max-w-[280px] leading-relaxed mx-auto">{project.description}</p>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* ========================================
            STATE 2: PLAYING MODE (COMPUTER)
            ========================================
          */}
          <div 
            className={`absolute inset-0 flex items-center justify-center pb-20 transition-all duration-700 ease-in-out
              ${viewMode === 'playing' ? 'opacity-100 translate-y-0 pointer-events-auto scale-100' : 'opacity-0 translate-y-full pointer-events-none scale-90'}
            `}
          >
            {/* Floating Action Buttons */}
            <div 
              className={`absolute top-6 right-6 z-50 flex gap-4 transition-all duration-500 ease-in-out delay-500
                ${viewMode === 'playing' && computerState === 'playing' ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}
              `}
            >
              <button 
                onClick={handleEject}
                className="px-4 py-2 bg-white text-black font-['Silkscreen'] text-sm hover:bg-red-400 transition-colors shadow-[4px_4px_0_0_#042687]"
              >
                &lt; BACK
              </button>
              {activeProject && (
                <button 
                  onClick={() => window.open(activeProject.url, '_blank')}
                  className="px-4 py-2 bg-[#a3e635] text-black font-['Silkscreen'] text-sm hover:bg-emerald-400 transition-colors shadow-[4px_4px_0_0_#042687]"
                >
                  RUN PROJECT
                </button>
              )}
            </div>

            <div className="w-full max-w-xl relative" style={{ perspective: '1000px' }}>
              
              {/* Pixel Computer SVG Shell */}
              <svg viewBox="0 0 100 100" className="w-full h-auto drop-shadow-2xl" style={{ shapeRendering: 'crispEdges' }}>
                {/* Monitor Case */}
                <rect x="10" y="5" width="80" height="70" fill={THEME.beige} stroke={THEME.black} strokeWidth="1" />
                <rect x="85" y="10" width="5" height="60" fill="rgba(0,0,0,0.1)" />
                <rect x="10" y="70" width="80" height="5" fill="rgba(0,0,0,0.2)" />
                
                {/* Screen Bezel */}
                <rect x="15" y="10" width="70" height="55" fill="#C2C0B3" stroke={THEME.black} strokeWidth="1" />
                
                {/* Base / Drive Area */}
                <rect x="5" y="75" width="90" height="20" fill={THEME.beige} stroke={THEME.black} strokeWidth="1" />
                <rect x="5" y="90" width="90" height="5" fill="rgba(0,0,0,0.2)" />
                
                {/* Floppy/CD Slot (Target for animation) */}
                <rect x="55" y="82" width="30" height="3" fill={THEME.black} />
                
                {/* Buttons & Indicators (Flashes Yellow, Plays Green) */}
                <rect x="88" y="82" width="3" height="3" fill={THEME.black} />
                <rect 
                  x="15" y="82" width="6" height="4" 
                  fill={computerState === 'idle' ? THEME.black : (computerState === 'playing' ? '#10b981' : '#eab308')} 
                  className={computerState === 'inserting' || computerState === 'reading' ? 'animate-blink' : ''}
                />
                
                {/* Screen Content via ForeignObject (Expanded fully edge to edge inside bezel) */}
                <foreignObject x="18" y="13" width="64" height="49">
                  <div className="w-full h-full relative overflow-hidden bg-black flex flex-col items-center justify-center font-['Silkscreen'] text-xs">
                    
                    {/* Idle State */}
                    {computerState === 'idle' && (
                      <div className="text-emerald-400 text-center flex flex-col items-center">
                        <p className="mb-2 text-[8px] sm:text-[10px]">SYSTEM READY</p>
                        <p className="animate-blink text-[8px] sm:text-[10px]">INSERT DISK...</p>
                      </div>
                    )}

                    {/* Reading / Noise State */}
                    {(computerState === 'inserting' || computerState === 'reading') && (
                      <div className="absolute inset-0 bg-black flex flex-col justify-start items-start p-1 overflow-hidden">
                        <div className="matrix-text" style={{ fontSize: '4px', lineHeight: '7px' }}>&gt; SYS_INIT... OK</div>
                        <div className="matrix-text" style={{ fontSize: '4px', lineHeight: '7px' }}>&gt; MOUNT //CD-ROM</div>
                        <div className="matrix-text" style={{ fontSize: '4px', lineHeight: '7px' }}>&gt; DECRYPTING...</div>
                        <div className="matrix-text animate-pulse" style={{ fontSize: '4px', lineHeight: '7px', marginTop: '2px' }}>&gt; READING SECTORS...</div>
                      </div>
                    )}

                    {/* Playing State */}
                    {computerState === 'playing' && activeProject && (
                      <div className="absolute inset-0 bg-white relative">
                        <img 
                          src={`https://api.microlink.io?url=${encodeURIComponent(activeProject.url)}&screenshot=true&embed=screenshot.url`}
                          alt={activeProject.title}
                          className="w-full h-full object-cover"
                          loading="lazy"
                        />
                        {/* Scanline overlay */}
                        <div className="absolute inset-0 pointer-events-none opacity-20" 
                             style={{ backgroundImage: 'linear-gradient(transparent 50%, rgba(0,0,0,0.5) 50%)', backgroundSize: '100% 4px' }} />
                      </div>
                    )}

                    {/* Screen Glare */}
                    <div className="absolute inset-0 pointer-events-none bg-gradient-to-tr from-transparent via-white/10 to-transparent" />
                  </div>
                </foreignObject>
              </svg>

              {/* Invisible target div for the animation end point */}
              <div ref={slotRef} className="absolute" style={{ left: '55%', top: '82%', width: '30%', height: '3%' }} />
            </div>
          </div>

          {/* ========================================
            FLOATING ANIMATED CD
            ========================================
          */}
          {flyingCD && (
            <div 
              className="absolute z-50 pointer-events-none transition-all"
              style={{
                width: flyingCD.width,
                height: flyingCD.width,
                left: flyingCD.startX,
                top: flyingCD.startY,
                transform: flyingCD.isMoving 
                  ? `translate(${flyingCD.endX - flyingCD.startX}px, ${flyingCD.endY - flyingCD.startY}px) scaleY(0.05) scaleX(0.7) rotate(720deg)` 
                  : 'translate(0, 0) scaleY(1) scaleX(1) rotate(0deg)',
                opacity: 1, // Stay visible while spinning to allow scale down to take effect seamlessly
                transitionDuration: '1200ms',
                transitionTimingFunction: 'cubic-bezier(0.3, 0, 0.2, 1)',
                transformOrigin: 'center'
              }}
            >
              <PixelCD category={flyingCD.project.category} className="w-full h-full shadow-2xl" />
            </div>
          )}

        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
